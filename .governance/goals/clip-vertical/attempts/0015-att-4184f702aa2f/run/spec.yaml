id: clipfactory
version: 1
root: ../../../../../..
task_type: CODE
objective: 'Repair the closure regressions so a re-run of closure verification passes:
  harden scripts/render_vertical.py so the 9:16 output (A3) and subject-following
  crop (A4) behaviours pass when the acceptance suite runs directly per-test, and
  add/adjust in-envelope regression coverage under tests/ that pins those behaviours,
  without ever touching the pinned acceptance paths.'
gate_policy:
  scope:
    required: true
  tests:
    required: true
  artifacts:
    required: true
  regressions:
    required: false
  reproducibility:
    required: false
review:
  enabled: false
  required: false
scope:
  baseline: .governance/baseline.json
  allow:
  - scripts
  - tests
  deny:
  - acceptance/
  - README.md
  - PIPELINE.md
  - acceptance
  - acceptance/test_vertical.py
  - acceptance/evaluate.py
  - .governance
  ignore:
  - .governance
  - .governance
  - .governance/runs
  - .governance/current.json
  - .gov-runs
  - output/
  - guiones/
  - .governance/
acceptance:
  tests:
    command: python3 -m pytest -q -p no:cacheprovider acceptance/test_vertical.py
    timeout: 1800.0
    junit: false
  artifacts:
    required:
    - path: README.md
      kind: file
    - path: PIPELINE.md
      kind: file
verification:
  reproducible_runs: 1
escalate_when: []
