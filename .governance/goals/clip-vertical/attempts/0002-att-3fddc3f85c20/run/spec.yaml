id: clipfactory
version: 1
root: ../../../../../..
task_type: CODE
objective: Crear scripts/render_vertical.py que reutilice vertical_cropper de CleanVideos
  para producir cortos 9:16 con recorte que sigue al sujeto, sin reimplementar la
  deteccion de pose
gate_policy:
  scope:
    required: true
  tests:
    required: true
  artifacts:
    required: true
  regressions:
    required: false
  reproducibility:
    required: false
review:
  enabled: false
  required: false
scope:
  baseline: .governance/baseline.json
  allow:
  - scripts
  deny:
  - acceptance/
  - README.md
  - PIPELINE.md
  - .governance
  - acceptance/test_vertical.py
  - acceptance/evaluate.py
  - acceptance
  ignore:
  - .governance
  - .governance
  - .governance/runs
  - .governance/current.json
  - .gov-runs
  - output/
  - guiones/
  - .governance/
acceptance:
  tests:
    command: python3 -m pytest -q -p no:cacheprovider acceptance/test_vertical.py
    timeout: 1800.0
    junit: false
  artifacts:
    required:
    - path: README.md
      kind: file
    - path: PIPELINE.md
      kind: file
verification:
  reproducible_runs: 1
escalate_when: []
