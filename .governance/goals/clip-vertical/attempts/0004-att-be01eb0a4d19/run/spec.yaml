id: clipfactory
version: 1
root: ../../../../../..
task_type: CODE
objective: Implementar la capacidad de recorte vertical 9:16 que sigue al sujeto en
  scripts/ reutilizando vertical_cropper de CleanVideos, de modo que las 7 pruebas
  de acceptance/test_vertical.py pasen (empezando por test_A7_sin_ffmpeg_falla_diciendo_por_que
  que falla por no encontrar o informar correctamente la ausencia de ffmpeg).
gate_policy:
  scope:
    required: true
  tests:
    required: true
  artifacts:
    required: true
  regressions:
    required: false
  reproducibility:
    required: false
review:
  enabled: false
  required: false
scope:
  baseline: .governance/baseline.json
  allow:
  - scripts
  - tests
  deny:
  - acceptance/
  - README.md
  - PIPELINE.md
  - .governance
  - acceptance/test_vertical.py
  - acceptance/evaluate.py
  - acceptance
  ignore:
  - .governance
  - .governance
  - .governance/runs
  - .governance/current.json
  - .gov-runs
  - output/
  - guiones/
  - .governance/
acceptance:
  tests:
    command: python3 -m pytest -q -p no:cacheprovider acceptance/test_vertical.py
    timeout: 1800.0
    junit: false
  artifacts:
    required:
    - path: README.md
      kind: file
    - path: PIPELINE.md
      kind: file
verification:
  reproducible_runs: 1
escalate_when: []
