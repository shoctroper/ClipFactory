id: clipfactory
version: 1
root: ../../../../../..
task_type: CODE
objective: Implementar el capability de recorte vertical 9:16 con seguimiento de sujeto
  en scripts/, reutilizando vertical_cropper de CleanVideos en vez de reimplementarlo,
  más sus pruebas unitarias en tests/, para que la suite de aceptación deje de fallar
  por módulos ausentes.
gate_policy:
  scope:
    required: true
  tests:
    required: true
  artifacts:
    required: true
  regressions:
    required: false
  reproducibility:
    required: false
review:
  enabled: false
  required: false
scope:
  baseline: .governance/baseline.json
  allow:
  - scripts
  - tests
  deny:
  - acceptance/
  - README.md
  - PIPELINE.md
  - acceptance
  - .governance
  ignore:
  - .governance
  - .governance
  - .governance/runs
  - .governance/current.json
  - .gov-runs
  - output/
  - guiones/
  - .governance/
acceptance:
  tests:
    command: python3 -m pytest -q -p no:cacheprovider acceptance/test_vertical.py
    timeout: 1800.0
    junit: false
  artifacts:
    required:
    - path: README.md
      kind: file
    - path: PIPELINE.md
      kind: file
verification:
  reproducible_runs: 1
escalate_when: []
