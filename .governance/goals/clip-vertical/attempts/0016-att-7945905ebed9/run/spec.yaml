id: clipfactory
version: 1
root: ../../../../../..
task_type: CODE
objective: Rework scripts/render_vertical.py so the rejection/closure per-test runs
  of acceptance A_Reencuadre tests A3 (salida 9:16) and A4 (recorte sigue al sujeto)
  pass, since closure runs 2 and 3 fail exactly on those two non-baseline cases while
  the deliverable is the only in-scope artifact.
gate_policy:
  scope:
    required: true
  tests:
    required: true
  artifacts:
    required: true
  regressions:
    required: false
  reproducibility:
    required: false
review:
  enabled: false
  required: false
scope:
  baseline: .governance/baseline.json
  allow:
  - scripts
  - tests
  deny:
  - acceptance/
  - README.md
  - PIPELINE.md
  ignore:
  - .governance
  - .governance
  - .governance/runs
  - .governance/current.json
  - .gov-runs
  - output/
  - guiones/
  - .governance/
acceptance:
  tests:
    command: python3 -m pytest -q -p no:cacheprovider acceptance/test_vertical.py
    timeout: 1800.0
    junit: false
  artifacts:
    required:
    - path: README.md
      kind: file
    - path: PIPELINE.md
      kind: file
verification:
  reproducible_runs: 1
escalate_when: []
