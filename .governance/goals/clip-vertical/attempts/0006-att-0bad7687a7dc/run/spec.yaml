id: clipfactory
version: 1
root: ../../../../../..
task_type: CODE
objective: 'Implementar la capacidad de ClipFactory para generar cortos verticales
  9:16 con recorte que sigue al sujeto, reutilizando vertical_cropper de CleanVideos:
  crear en scripts/ el módulo/pipeline de recorte vertical (invocación de vertical_cropper,
  salida 9:16, seguimiento de sujeto, manejo ausente de ffmpeg con error claro) y
  en tests/ las pruebas unitarias cubriendo esos comportamientos, sin modificar acceptance/
  ni la documentación restringida.'
gate_policy:
  scope:
    required: true
  tests:
    required: true
  artifacts:
    required: true
  regressions:
    required: false
  reproducibility:
    required: false
review:
  enabled: false
  required: false
scope:
  baseline: .governance/baseline.json
  allow:
  - scripts
  - tests
  deny:
  - acceptance/
  - README.md
  - PIPELINE.md
  - .governance
  - acceptance
  - acceptance/test_vertical.py
  - acceptance/evaluate.py
  ignore:
  - .governance
  - .governance
  - .governance/runs
  - .governance/current.json
  - .gov-runs
  - output/
  - guiones/
  - .governance/
acceptance:
  tests:
    command: python3 -m pytest -q -p no:cacheprovider acceptance/test_vertical.py
    timeout: 1800.0
    junit: false
  artifacts:
    required:
    - path: README.md
      kind: file
    - path: PIPELINE.md
      kind: file
verification:
  reproducible_runs: 1
escalate_when: []
